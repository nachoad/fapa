name: Claude Web Builder
on:
  issues:
    types: [labeled]

jobs:
  claude:
    if: github.event.label.name == 'claude-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          allowed_tools: |
            Bash(git *),
            Bash(gh pr *),
            Bash(ls *),
            Bash(find *),
            Bash(grep *),
            Bash(cat *),
            Bash(mkdir *),
            Bash(cp *),
            Bash(mv *),
            Edit,
            Read,
            Write
          prompt: |
            Lee el título y la descripción del issue #${{ github.event.issue.number }} como una tarea de desarrollo web.
            Implementa los cambios en el código del repositorio (HTML, CSS, JS o lo que aplique).
            Si necesitas editar varios archivos, hazlo todo en el mismo conjunto de cambios.
            Crea una rama nueva, haz commit de los cambios, y abre un pull request contra main para que pueda revisarlo antes de mergear.
            No hagas commit directo a main.
